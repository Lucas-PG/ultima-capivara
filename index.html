.boot-screen img{width:70px;height:70px}.boot-screen strong{font-size:29px;letter-spacing:3px;margin-top:10px}.boot-screen span{color:#99b192}
#game{position:fixed;inset:0;width:100%;height:100%}</style></head><body>
