<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Capivara sculpt preview</title>
<style>
  html, body { margin: 0; background: #7d7f82; overflow: hidden; }
  canvas { display: block; }
  #ref { position: absolute; right: 0; top: 0; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Development-only view of the SDF sculpt (PLY with vertex colours) under a sun + sky rig.
// ?ply=/output/preview/capy.ply&view=front|side|back|three|head|headside|headthree|feet|paw&ref=<image url>
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#7d7f82');
scene.add(new THREE.HemisphereLight('#dfe8ff', '#6b5a48', 1.25));
const sun = new THREE.DirectionalLight('#fff3e0', 2.6); sun.position.set(-2.2, 4, -3.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -1.2; sun.shadow.camera.right = 1.2; sun.shadow.camera.top = 2.2; sun.shadow.camera.bottom = -.2;
sun.shadow.bias = -.0004; scene.add(sun);
const fill = new THREE.DirectionalLight('#cfe0ff', .5); fill.position.set(3, 1.5, 2); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: '#8d8f92', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const views = {
  front: [[0, .95, -4.2], [0, .92, 0], 30], side: [[-4.2, .95, 0], [0, .92, 0], 30], back: [[0, .95, 4.2], [0, .92, 0], 30],
  three: [[-2.6, 1.3, -3.3], [0, .92, 0], 30], head: [[0, 1.64, -2.4], [0, 1.62, -.08], 17], headside: [[-2.4, 1.64, -.10], [0, 1.62, -.10], 17],
  headthree: [[-1.55, 1.78, -1.85], [0, 1.62, -.1], 17], eye: [[-.75, 1.74, -.42], [-.12, 1.715, -.06], 12], feet: [[-.9, .35, -1.1], [.05, .1, -.05], 30], paw: [[.9, 1.2, -.9], [.3, 1.0, -.35], 20],
  torso: [[-1.2, 1.2, -2.2], [0, 1.1, 0], 30], rear: [[1.8, 1.4, 2.6], [0, 1.0, 0], 30], armpit: [[-.85, .98, .30], [-.22, 1.20, -.02], 24], armpit2: [[-.55, .92, -.80], [-.22, 1.20, -.02], 24],
};
const [eye, target, fov] = views[params.get('view') || 'front'];
const camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, .05, 50);
camera.position.set(...eye); camera.lookAt(...target);
// Key light from the camera's upper left, so every view reads its forms the same way.
const toCam = new THREE.Vector3(...eye).sub(new THREE.Vector3(...target)).normalize();
const left = new THREE.Vector3().crossVectors(toCam, new THREE.Vector3(0, 1, 0)).normalize();
sun.position.copy(new THREE.Vector3(...target)).addScaledVector(toCam, 2.5).addScaledVector(left, 2.2).add(new THREE.Vector3(0, 3.2, 0));
sun.target.position.set(...target); scene.add(sun.target);
fill.position.copy(new THREE.Vector3(...target)).addScaledVector(toCam, 2).addScaledVector(left, -2.5);
const geometry = await new PLYLoader().loadAsync(params.get('ply') || '/output/preview/capy.ply');
geometry.computeVertexNormals();
const colors = geometry.getAttribute('color');

const clay = params.has('clay');
const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: !clay, color: clay ? '#b8b0a4' : '#ffffff', roughness: .82, side: THREE.DoubleSide }));
mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
if (params.get('ref')) {
  const img = document.createElement('img'); img.id = 'ref'; img.src = params.get('ref'); document.body.appendChild(img);
}
renderer.render(scene, camera);
window.ready = true;
</script>
</body>
</html>
