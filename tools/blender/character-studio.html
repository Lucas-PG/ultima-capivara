<!-- Camera and bible A lighting match Pincel's M1 review setup. -->
<!doctype html><html><head><link rel="icon" href="../../assets/favicon.svg"></head><body style="margin:0;background:#e9e4d8"><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 900;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.1;
r.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || '#e9e4d8');
scene.add(new THREE.HemisphereLight('#b4c2ee', '#c9a66b', 1.15));
const sun = new THREE.DirectionalLight('#ffd9a8', 2.7); sun.position.set(-3, 4, 3); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: '#8cc453', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; if (!q.get('noground')) scene.add(ground);
const cam = new THREE.PerspectiveCamera(+q.get('fov') || 30, W / H, .01, 500);
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`${import.meta.env.BASE_URL}models/capybara/capybara.glb`);
let pipeline;
if (q.has('runtime')) {
  const { PaintedSky } = await import('../../src/render/sky');
  const sky = new PaintedSky(), skyScene = new THREE.Scene(); skyScene.add(sky.group);
  const pmrem = new THREE.PMREMGenerator(r);
  const environment = pmrem.fromScene(skyScene, .035, .1, 850, { size: 128 });
  scene.environment = environment.texture; scene.environmentIntensity = .35; pmrem.dispose();
  addEventListener('beforeunload', () => { sky.dispose(); environment.dispose(); });
  sun.position.set(-70, 55, -30);
  const { applyCharacterStyle } = await import('../../src/render/materials');
  const { RenderPipeline } = await import('../../src/render/pipeline');
  pipeline = new RenderPipeline(r, 2); pipeline.resize();
  const styled = new Map();
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.layers.enable(1);
    if (!styled.has(o.material)) styled.set(o.material, applyCharacterStyle(o.material.clone()));
    o.material = styled.get(o.material);
  });
}
const model = gltf.scene; model.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
// Keep LOD0 only.
const lods = []; model.traverse(o => { if (o.isMesh || o.isSkinnedMesh) lods.push(o); });
window.meshes = lods.map(o => o.name);
const lod = q.get('lod') || '0';
model.traverse(o => {
  const level = /LOD([012])$/.exec(o.name);
  if (level) o.visible = level[1] === lod;
});
scene.add(model);
window.clips = gltf.animations.map(a => a.name);
const mixer = new THREE.AnimationMixer(model);
const clipName = q.get('clip'); const t = +(q.get('t') || 0);
const idle = gltf.animations.find(a => /idle/i.test(a.name));
if (clipName) { const c = gltf.animations.find(a => a.name === clipName); if (c) { mixer.clipAction(c).play(); } }
else if (idle && !q.get('rest')) mixer.clipAction(idle).play();
mixer.update(t);
if (q.get('sil')) model.traverse(o => { if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ color: '#1a120c' }); });
const yaw = +(q.get('yaw') || 0) * Math.PI / 180, dist = +(q.get('d') || 4.2), ty = +(q.get('ty') || .95);
cam.position.set(Math.sin(yaw) * dist, ty + +(q.get('cy') || 0), Math.cos(yaw) * dist); cam.lookAt(0, ty, 0);
const render = () => pipeline ? pipeline.render(scene, cam, {}) : r.render(scene, cam);
if (q.has('expressions')) {
  const expressions = [
    ['neutral', 'Neutro'], ['determined', 'Determinado'], ['hit', 'Dano'],
    ['stunned', 'Atordoado'], ['victory', 'Vitória'], ['blink', 'Piscada'],
  ];
  const width = W / 3, height = H / 2;
  cam.aspect = width / height; cam.updateProjectionMatrix();
  r.setSize(width, height); pipeline?.resize();
  expressions.forEach(([name, label], i) => {
    const x = i % 3 * width, y = Math.floor(i / 3) * height;
    mixer.stopAllAction(); mixer.clipAction(gltf.animations.find(clip => clip.name === `face_${name}`)).reset().play();
    mixer.setTime(t);
    render();
    const frame = document.createElement('img'); frame.src = r.domElement.toDataURL();
    frame.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${width}px;height:${height}px`;
    document.body.append(frame);
    const caption = document.createElement('div'); caption.textContent = label;
    caption.style.cssText = `position:absolute;left:${x + 24}px;top:${y + 18}px;font:600 18px system-ui;color:#3a2418`;
    document.body.append(caption);
  });
  r.domElement.hidden = true;
} else render();
const box = new THREE.Box3().setFromObject(model); window.bounds = { min: box.min.toArray(), max: box.max.toArray() };
window.ready = true;
window.studio = { model, mixer, scene, camera:cam, renderer:r, clips:gltf.animations };
addEventListener('beforeunload', () => { pipeline?.dispose(); r.dispose(); });
</script></body></html>
