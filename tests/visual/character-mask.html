<!doctype html>
<!-- GPU contract: MSAA world depth versus a single-sample ID pass at near .01. -->
<html><body><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { CharacterMask } from '../../src/render/character-mask';
const size=256,gl=new THREE.WebGLRenderer({canvas:document.querySelector('canvas')});gl.setSize(size,size);gl.setClearColor(0);gl.toneMapping=THREE.NoToneMapping;
const world=new THREE.WebGLRenderTarget(size,size,{samples:4});world.depthTexture=new THREE.DepthTexture(size,size);
const reference=new THREE.WebGLRenderTarget(size,size);
const mask=new CharacterMask(world.depthTexture);mask.resize(size,size);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,1,.01,850);
const body=new THREE.Mesh(new THREE.PlaneGeometry(1,1,12,12),new THREE.MeshBasicMaterial({color:0xffffff}));body.layers.enable(1);scene.add(body);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0x000000}));scene.add(wall);
const pixels=new Uint8Array(size*size*4),expected=new Uint8Array(pixels.length),cases=[];
// Keep the face large enough to measure at every distance; the last two cases
// straddle the 150 m cutoff without a sloped face crossing that boundary.
for(const distance of [3,30,60,149,151])for(const blocked of [false,true]) {
 body.position.set(0,0,-distance);body.rotation.y=distance>=149?0:.8;body.scale.setScalar(distance*.5);
 wall.visible=blocked;wall.position.set(0,0,-distance*.8);wall.scale.setScalar(distance*.6);
 gl.setRenderTarget(world);gl.render(scene,camera);
 mask.render(gl,scene,camera);gl.readRenderTargetPixels(mask.target,0,0,size,size,pixels);
 gl.setRenderTarget(reference);gl.render(scene,camera);gl.readRenderTargetPixels(reference,0,0,size,size,expected);
 let inside=0,holes=0,leaks=0;
 for(let y=2;y<size-2;y++)for(let x=2;x<size-2;x++){
  const i=(y*size+x)*4;
  // Exclude silhouette pixels so coverage antialiasing is not counted as a hole.
  const solid=expected[i]>250&&expected[i-4]>250&&expected[i+4]>250&&expected[i-size*4]>250&&expected[i+size*4]>250;
  if(solid&&distance<150){inside++;if(pixels[i]<250)holes++;}
  if((blocked||distance>150)&&pixels[i]>10)leaks++;
 }
 cases.push({distance,blocked,inside,holes,leaks});
}
mask.dispose();world.dispose();reference.dispose();body.geometry.dispose();wall.geometry.dispose();body.material.dispose();wall.material.dispose();gl.dispose();window.result=cases;
</script></body></html>
